# Stack indépendante : registry Docker privé + interface web Joxit
# À lancer séparément :  docker compose -f docker-compose.registry.yml up -d
# Une fois lancée, on peut pousser l'image API :
#   docker tag mon-api:1.0.0 ${REGISTRY_HOST}:${REGISTRY_PORT}/mon-api:1.0.0
#   docker push                ${REGISTRY_HOST}:${REGISTRY_PORT}/mon-api:1.0.0

services:
  registry:
    image: registry:2
    container_name: tp13-registry
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      # Autorise l'UI à appeler l'API du registry depuis un autre origin
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: '[http://localhost:${REGISTRY_UI_PORT:-8080}]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: '[HEAD,GET,OPTIONS,DELETE]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Credentials: '[true]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: '[Authorization,Accept,Cache-Control]'
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: '[Docker-Content-Digest]'
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - registry_net

  registry-ui:
    image: joxit/docker-registry-ui:main
    container_name: tp13-registry-ui
    restart: unless-stopped
    ports:
      - "${REGISTRY_UI_PORT:-8080}:80"
    environment:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: "TP13 - Registry privé"
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
      NGINX_PROXY_PASS_URL: "http://registry:5000"
      SHOW_CATALOG_NB_TAGS: "true"
      CATALOG_MIN_BRANCHES: "1"
      CATALOG_MAX_BRANCHES: "1"
      TAGLIST_PAGE_SIZE: "100"
      REGISTRY_SECURED: "false"
      CATALOG_ELEMENTS_LIMIT: "1000"
    depends_on:
      - registry
    networks:
      - registry_net

networks:
  registry_net:
    name: tp13_registry_net
    driver: bridge

volumes:
  registry_data:
    name: tp13_registry_data
