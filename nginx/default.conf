# Reverse-proxy + load balancer pour le TP13
# - GET /        → round-robin entre cat et dog
# - GET /cat     → exclusivement vers le service cat
# - GET /dog     → exclusivement vers le service dog

# Upstream round-robin (l'algorithme par défaut de Nginx)
upstream api_pool {
    server cat:3000 max_fails=3 fail_timeout=10s;
    server dog:3000 max_fails=3 fail_timeout=10s;
}

# Upstreams dédiés pour /cat et /dog (un seul backend chacun)
upstream cat_only {
    server cat:3000;
}

upstream dog_only {
    server dog:3000;
}

server {
    listen       80;
    server_name  _;

    # Désactive le cache pour bien voir l'alternance lors de la validation
    add_header Cache-Control "no-store" always;

    # Round-robin entre cat et dog
    location = / {
        proxy_pass http://api_pool/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /cat → service cat uniquement (on réécrit l'URI vers / pour cibler GET /)
    location = /cat {
        proxy_pass http://cat_only/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /dog → service dog uniquement
    location = /dog {
        proxy_pass http://dog_only/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sonde Nginx pour healthcheck
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
