# Reverse-proxy + load balancer pour le TP13
# - GET /            → round-robin entre cat et dog
# - GET /cat         → exclusivement vers le service cat
# - GET /dog         → exclusivement vers le service dog
# - GET /prometheus/ → reverse proxy vers Prometheus (route_prefix /prometheus configuré côté serveur)
# - GET /grafana/    → reverse proxy vers Grafana   (GF_SERVER_SERVE_FROM_SUB_PATH activé)
# - GET /portainer/  → reverse proxy vers Portainer

# Upstream round-robin (l'algorithme par défaut de Nginx)
upstream api_pool {
    server cat:3000;
    server dog:3000;
}

upstream cat_only       { server cat:3000; }
upstream dog_only       { server dog:3000; }
upstream prometheus_up  { server prometheus:9090; }
upstream grafana_up     { server grafana:3000; }
upstream portainer_up   { server portainer:9000; }

server {
    listen       80 default_server;
    server_name  _;

    # Désactive le cache pour bien voir l'alternance lors de la validation
    add_header Cache-Control "no-store" always;

    # /cat → service cat uniquement (exact match prioritaire)
    location = /cat {
        proxy_pass http://cat_only/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /dog → service dog uniquement (exact match prioritaire)
    location = /dog {
        proxy_pass http://dog_only/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sonde Nginx
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --------- Reverse proxy vers les outils d'observabilité ---------

    # Prometheus écoute avec --web.external-url=/prometheus/ et --web.route-prefix=/prometheus
    # → on lui passe le chemin tel quel (pas de slash final dans proxy_pass pour préserver /prometheus)
    location /prometheus/ {
        proxy_pass http://prometheus_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana est configuré avec GF_SERVER_ROOT_URL=http://.../grafana et GF_SERVER_SERVE_FROM_SUB_PATH=true
    # Il gère lui-même le sous-chemin, donc on passe le chemin tel quel
    location /grafana/ {
        proxy_pass http://grafana_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Indispensable pour le live-tail (WebSocket)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # Portainer : on rewrite le chemin pour retirer /portainer/
    location /portainer/ {
        proxy_pass http://portainer_up/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # Round-robin entre cat et dog pour TOUT le reste (y compris /)
    location / {
        proxy_pass http://api_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
