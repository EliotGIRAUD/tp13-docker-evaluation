# Conf globale Nginx pour le TP13.
# On force worker_processes à 1 pour garantir un round-robin déterministe :
# avec plusieurs workers, chacun maintient SON propre état d'upstream et démarre
# par le premier serveur (cat), ce qui peut casser l'alternance attendue.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" -> upstream=$upstream_addr';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
