# Stack principale du TP13 :
#   - cat  : instance de l'API avec PET=cat   (réseau interne uniquement)
#   - dog  : instance de l'API avec PET=dog   (réseau interne uniquement)
#   - nginx: reverse-proxy / load-balancer    (port 80 exposé sur l'hôte)
#   - prometheus / grafana / cadvisor / node-exporter / portainer (observabilité)
#
# Toutes les valeurs configurables passent par le fichier .env (voir .env / .env.example).
# L'image de l'API est tirée du registry privé : ${REGISTRY_HOST}:${REGISTRY_PORT}/${API_IMAGE_NAME}:${API_IMAGE_TAG}

services:
  cat:
    image: ${REGISTRY_HOST}:${REGISTRY_PORT}/${API_IMAGE_NAME}:${API_IMAGE_TAG}
    container_name: tp13-cat
    restart: unless-stopped
    environment:
      PET: ${CAT_PET}
      PORT: ${API_PORT}
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:${API_PORT}/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  dog:
    image: ${REGISTRY_HOST}:${REGISTRY_PORT}/${API_IMAGE_NAME}:${API_IMAGE_TAG}
    container_name: tp13-dog
    restart: unless-stopped
    environment:
      PET: ${DOG_PET}
      PORT: ${API_PORT}
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:${API_PORT}/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: tp13-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      cat:
        condition: service_healthy
      dog:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  # --------- Observabilité (Partie 7) ---------

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tp13-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app_net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: tp13-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    networks:
      - app_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: tp13-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - app_net

  grafana:
    image: grafana/grafana:11.2.2
    container_name: tp13-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - app_net

  portainer:
    image: portainer/portainer-ce:2.21.4
    container_name: tp13-portainer
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    ports:
      - "${PORTAINER_PORT}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - app_net

networks:
  app_net:
    name: tp13_app_net
    driver: bridge

volumes:
  prometheus_data:
    name: tp13_prometheus_data
  grafana_data:
    name: tp13_grafana_data
  portainer_data:
    name: tp13_portainer_data
